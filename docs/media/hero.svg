<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hash D Island — your notch, finally alive. A living, glanceable area around the MacBook notch: now playing, internet speed, battery, temperatures and AI token usage. Native Swift for Apple Silicon. Nothing leaves your Mac.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0C10"/>
      <stop offset="1" stop-color="#141520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#408CFF"/>
      <stop offset="1" stop-color="#47D67A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1D2A"/>
      <stop offset="1" stop-color="#101119"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101119"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#408CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#408CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#47D67A" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#47D67A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#FFFFFF" opacity="0.032"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="14" fill="url(#dots)"/>
  <ellipse cx="880" cy="120" rx="400" ry="260" fill="url(#glow)"/>
  <ellipse cx="1120" cy="340" rx="280" ry="190" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="14" fill="none" stroke="#232534" stroke-width="1"/>

  <!-- ── left: wordmark and promise ───────────────────────────────── -->
  <text x="72" y="118" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, Segoe UI, sans-serif" font-size="52" font-weight="700" fill="#F4F6FB" letter-spacing="-1.2">Hash D Island</text>
  <rect x="72" y="140" width="96" height="4" rx="2" fill="url(#accent)"/>

  <text x="72" y="192" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, Segoe UI, sans-serif" font-size="21" font-weight="600" fill="#C6CCDA">Your notch, finally alive.</text>
  <text x="72" y="226" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, Segoe UI, sans-serif" font-size="15" fill="#7C879C">The dead space around the notch becomes a living, glanceable</text>
  <text x="72" y="248" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, Segoe UI, sans-serif" font-size="15" fill="#7C879C">area — built purely for Apple Silicon, and it never phones home.</text>

  <!-- capability chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', ui-monospace, monospace" font-size="12" font-weight="600">
    <rect x="72" y="278" width="96" height="27" rx="13.5" fill="#408CFF" fill-opacity="0.12" stroke="#408CFF" stroke-opacity="0.32"/>
    <text x="120" y="296" fill="#8FBAFF" text-anchor="middle">Now Playing</text>

    <rect x="178" y="278" width="76" height="27" rx="13.5" fill="#47D67A" fill-opacity="0.10" stroke="#47D67A" stroke-opacity="0.28"/>
    <text x="216" y="296" fill="#8BE0AB" text-anchor="middle">Battery</text>

    <rect x="264" y="278" width="98" height="27" rx="13.5" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="313" y="296" fill="#AEB7C8" text-anchor="middle">Temperatures</text>

    <rect x="372" y="278" width="86" height="27" rx="13.5" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="415" y="296" fill="#AEB7C8" text-anchor="middle">AI tokens</text>
  </g>

  <text x="72" y="337" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', ui-monospace, monospace" font-size="12.5" fill="#5C6679" letter-spacing="0.3">macOS 14+  ·  Apple Silicon  ·  native Swift  ·  no accounts, no telemetry</text>

  <!-- ── right: the island itself, drawn as it behaves ────────────── -->
  <g transform="translate(672, 52)">
    <!-- screen top -->
    <rect x="0" y="0" width="452" height="276" rx="16" fill="url(#screen)" stroke="#2A2D3E" stroke-width="1"/>
    <rect x="0" y="0" width="452" height="26" rx="16" fill="#0D0E16"/>
    <rect x="0" y="18" width="452" height="10" fill="#0D0E16"/>

    <!-- menu-bar hints, deliberately left clear by the app -->
    <g fill="#3A4055">
      <rect x="16" y="10" width="26" height="6" rx="3"/>
      <rect x="50" y="10" width="18" height="6" rx="3"/>
      <rect x="406" y="10" width="16" height="6" rx="3"/>
      <rect x="428" y="10" width="18" height="6" rx="3"/>
    </g>

    <!-- live strip: artwork left of the notch, title right of it. Everything
         sits clear of 160..292, which is where the notch itself is. -->
    <g>
      <rect x="104" y="0" width="292" height="34" rx="11" fill="url(#island)"/>
      <rect x="112" y="7" width="20" height="20" rx="5" fill="#408CFF" fill-opacity="0.85"/>
      <rect x="300" y="12" width="62" height="5" rx="2.5" fill="#E8ECF5" fill-opacity="0.92"/>
      <rect x="300" y="21" width="38" height="4" rx="2" fill="#7C879C"/>
      <!-- audio bars -->
      <g fill="#47D67A">
        <rect x="370" y="15" width="3" height="7" rx="1.5"/>
        <rect x="376" y="10" width="3" height="12" rx="1.5"/>
        <rect x="382" y="13" width="3" height="9" rx="1.5"/>
        <rect x="388" y="8" width="3" height="14" rx="1.5"/>
      </g>
    </g>

    <!-- the physical notch, matched exactly at rest -->
    <path d="M160 0 h132 v20 a8 8 0 0 1 -8 8 h-116 a8 8 0 0 1 -8 -8 z" fill="#000000"/>

    <!-- dropped panel -->
    <g transform="translate(140, 40)">
      <rect x="0" y="0" width="172" height="196" rx="20" fill="url(#island)" stroke="#262A3A" stroke-width="1"/>

      <!-- now playing row -->
      <rect x="16" y="18" width="34" height="34" rx="9" fill="#408CFF" fill-opacity="0.85"/>
      <rect x="58" y="24" width="76" height="5" rx="2.5" fill="#E8ECF5" fill-opacity="0.9"/>
      <rect x="58" y="35" width="50" height="4" rx="2" fill="#6E788C"/>
      <rect x="16" y="62" width="140" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.14"/>
      <rect x="16" y="62" width="86" height="3" rx="1.5" fill="url(#accent)"/>

      <!-- readout rows -->
      <g font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', ui-monospace, monospace" font-size="9">
        <text x="16" y="92" fill="#7C879C">Internet</text>
        <text x="156" y="92" fill="#E8ECF5" text-anchor="end">4.2 MB/s</text>

        <text x="16" y="114" fill="#7C879C">Battery</text>
        <text x="156" y="114" fill="#47D67A" text-anchor="end">86%</text>

        <text x="16" y="136" fill="#7C879C">CPU</text>
        <text x="156" y="136" fill="#E8ECF5" text-anchor="end">52°</text>

        <text x="16" y="158" fill="#7C879C">Tokens today</text>
        <text x="156" y="158" fill="#8FBAFF" text-anchor="end">1.28M</text>
      </g>

      <!-- media controls -->
      <g fill="#AEB7C8" transform="translate(0, 4)">
        <path d="M53 172 l9 -6 v12 z"/>
        <rect x="76" y="166" width="4" height="12" rx="1.5" fill="#F4F6FB"/>
        <rect x="84" y="166" width="4" height="12" rx="1.5" fill="#F4F6FB"/>
        <path d="M113 172 l-9 -6 v12 z"/>
      </g>
    </g>
  </g>
</svg>
